[project]
name = "mcp-server-client-basic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AbhiMokashi01", email = "abhishekmokashi0102@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.0",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "langchain[mcp]>=1.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.0",
    "langchain-openapi>=0.1.1",
    "langgraph>=1.2.14",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "tavily>=1.1.0",
    "langchain-core>=1.6.9",
]

[project.scripts]
mcp-server-client-basic = "mcp_server_client_basic:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
