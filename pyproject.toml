[project]
name = "mcp-server-client-basic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AbhiMokashi01", email = "abhishekmokashi0102@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.0",
    "langchain>=1.4.4",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.7.0",
    "langchain-openapi>=0.1.1",
    "langgraph>=1.2.14",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mcp-server-client-basic = "mcp_server_client_basic:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
